    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- Sivun otsikko -->
    <h1>Tulevat pelijulkaisut</h1>
    
    <!-- Sivuston kuvaus -->

    </p>

<!-- Luo taulukon otsikkorivin. -->
    <div id="gameList">
        <table>
            <thead>
            <tr>
                <th>Kuva</th>
                <th>Nimi</th>
                <th>Genre</th>

            </tr>
            </thead>
            <!-- Tämän sisälle luodaan JavaScriptillä taulukko. -->
            <tbody id="gameTableBody"></tbody>
        </table>
